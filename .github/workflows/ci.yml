name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 57 requires Node 22.13+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (blocking)
        run: npx expo lint --max-warnings 0

      - name: Unit tests (demo world + recovery parser + demo flag)
        run: |
          npx tsx backend_src/tests/reveal_privacy_demo.test.ts
          npx tsx backend_src/tests/preview_smoke.test.ts
          npx tsx backend_src/tests/demo_tour.test.ts
          npx tsx backend_src/tests/recovery_link.test.ts
          npx tsx backend_src/tests/demo_flag.test.ts
          npx tsx backend_src/tests/build_config.test.mjs
          npx tsx backend_src/tests/adapter_map.test.mjs

      - name: Web build
        run: npx expo export --platform web

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  couples-api:
    name: Couples API security Function (Appwrite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13

      # Zero-dependency adversarial suite: runs the real function entrypoint
      # against an in-memory Appwrite TablesDB REST mock. Values below are
      # synthetic test placeholders (also in functions/couples-api/.env.test).
      - name: Couples API adversarial tests
        run: node --test functions/couples-api/test/main.test.mjs functions/couples-api/test/seed-script.test.mjs
        env:
          APPWRITE_ENDPOINT: https://sgp.cloud.appwrite.io/v1
          APPWRITE_API_KEY: test-server-key
          APPWRITE_FUNCTION_PROJECT_ID: test-project
          APPWRITE_CODE_PEPPER: test-pepper-0123456789abcdef

  migration:
    name: SQL migration + authorization on real Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs backend_src/0001_initial_schema.sql UNMODIFIED against a real
      # Postgres engine (PGlite, the Postgres wasm build used by
      # @electric-sql/pglite), with a Supabase-equivalent runtime: anon /
      # authenticated / service_role roles, an auth schema with auth.users
      # and auth.uid() reading request.jwt.claims. Then drives the full
      # authorization matrix under real authenticated roles: invite expiry,
      # replay, third-user joins, blocked direct inserts, profile-field
      # protection, reveal privacy, cross-couple isolation, pocket-note
      # rules, anon denial, unpair and account deletion. 19 checks must all
      # pass or the job fails.
      - name: Apply full migration and run authorization tests
        run: node scripts/migrate-and-test.mjs

  config-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13

      - name: Install dependencies
        run: npm ci

      - name: expo-doctor
        run: npx expo-doctor@latest

      - name: Fail on committed secrets
        run: |
          # .env must never be committed; only .env.example is allowed.
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is committed — remove it and rotate any credentials"
            exit 1
          fi
          # Real-secret detection: look for actual key material, not role
          # names. Supabase anon/service keys are base64 JWT-ish strings
          # starting "eyJ"; generic high-entropy assignments are flagged.
          # Docs and the SQL test fixtures are excluded.
          if git grep -nE 'eyJ[A-Za-z0-9_-]{20,}' -- ':!*.md' ':!.env.example' ':!backend_src/tests'; then
            echo "::error::possible real key material committed"
            exit 1
          fi
          if git grep -nE "(SUPABASE_[A-Z_]*KEY|SUPABASE_SERVICE)\s*=\s*[\"'][^\"']{8,}" -- ':!.env.example' ':!backend_src/tests'; then
            echo "::error::possible hardcoded Supabase key"
            exit 1
          fi
          echo "secret check OK"

      - name: Fail on client-side Appwrite administrative secrets
        run: |
          # Server-side Appwrite credentials (API key, pepper) must never
          # reach the client bundle or the repository. EXPO_PUBLIC_* vars are
          # embedded in the APK by design, so any administrative secret there
          # is a hard failure. Only synthetic placeholders in the function's
          # own test fixtures and CI env are allowed.
          if git grep -nE 'EXPO_PUBLIC_[A-Z_]*APPWRITE_(API_KEY|CODE_PEPPER)' -- ':!*.md'; then
            echo "::error::administrative Appwrite secret exposed via EXPO_PUBLIC_* (would be embedded in the APK)"
            exit 1
          fi
          if git grep -nE 'APPWRITE_(API_KEY|CODE_PEPPER)\s*[=:]\s*["'"'"'][^"'"'"'$'"'"']{8,}' \
              -- ':!functions/couples-api/.env.test' ':!functions/couples-api/test' ':!.github/workflows/ci.yml' ':!*.md'; then
            echo "::error::possible real Appwrite key/pepper committed outside test fixtures"
            exit 1
          fi
          echo "appwrite secret check OK"

      - name: Validate eas.json build profiles
        run: |
          node -e "
          const e = require('./eas.json');
          for (const p of ['preview','production']) {
            if (!e.build[p]) throw new Error('missing profile ' + p);
          }
          if (e.build.preview.android.buildType !== 'apk') throw new Error('preview must build apk');
          if (e.build.production.android.buildType !== 'app-bundle') throw new Error('production must build app-bundle');
          if (e.build.preview.environment !== 'preview') throw new Error('preview must use EAS environment \"preview\"');
          if (e.build.production.environment !== 'production') throw new Error('production must use EAS environment \"production\"');
          console.log('eas.json profiles OK');
          "
